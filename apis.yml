aid: inference
name: Inference
description: 'Inference (inference.net) is an AI infrastructure platform for AI-native
  teams. It offers an OpenAI-compatible inference API for open-source, frontier, and
  custom fine-tuned language models, alongside Catalyst — its observability, tracing,
  evaluation, training, and deployment platform. Developers call chat completions,
  batch/async inference, function calling, structured outputs, and vision endpoints
  at https://api.inference.net/v1 using a Bearer API key; route and monitor traffic
  through the Catalyst Gateway; fine-tune and deploy custom models; and optimize agents
  end to end with HALO. The platform ships a first-party CLI (inf), a hosted MCP server,
  and webhooks for asynchronous inference. Backed by Multicoin Capital.'
